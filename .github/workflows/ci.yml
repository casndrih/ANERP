name: ANERP CI

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - feature/phase-1-erp-foundation
      - feature/phase-2-auth-tenancy
      - feature/phase-3-inventory-procurement
      - feature/phase-4-hr-payroll
      - feature/phase-5-finance-accounting
      - feature/phase-6-reporting-analytics
      - feature/phase-7-production-readiness
      - feature/phase-8-inventory-controls
      - feature/phase-9-procurement-controls
      - feature/phase-10-sales-pos-receivables
  push:
    branches:
      - main
      - feature/phase-2-auth-tenancy
      - feature/phase-6-reporting-analytics
      - feature/phase-7-production-readiness
      - feature/phase-8-inventory-controls
      - feature/phase-9-procurement-controls
      - feature/phase-10-sales-pos-receivables

permissions:
  contents: read

jobs:
  reporting-unit-tests:
    name: Reporting and tenant-isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: anerp_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql
          coverage: none

      - name: Bootstrap Laravel test harness
        run: |
          composer create-project laravel/laravel:^12.0 /tmp/anerp-test --no-interaction
          cp -a app routes database resources /tmp/anerp-test/
          rm -f /tmp/anerp-test/tests/Feature/ExampleTest.php /tmp/anerp-test/tests/Unit/ExampleTest.php
          cd /tmp/anerp-test
          php artisan migrate:fresh --force
          if [ -d "$GITHUB_WORKSPACE/tests" ] && find "$GITHUB_WORKSPACE/tests" -type f -name '*Test.php' -print -quit | grep -q .; then
            cp -a "$GITHUB_WORKSPACE/tests/." /tmp/anerp-test/tests/
            php artisan test
          else
            echo "No project test files exist on this phase; migration smoke test completed."
          fi

  container-build:
    name: Build deployment image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ANERP image
        run: docker build --file deploy/Dockerfile --tag anerp:ci .
